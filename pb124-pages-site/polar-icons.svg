<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- =========================================================================
       AMOH / OLEA POLAR NAUTICAL & SCIENTIFIC VECTOR SPRITE LIBRARY (24x24 px)
       Standards: IHO S-52, IEC 62288, SCAR Marine GIS Taxonomy
       Lead Designer: Juan Sebastián Huertas Olea
       ========================================================================= -->

  <!-- 1. Tabular Iceberg (Category A Hazard) -->
  <symbol id="amoh-icon-iceberg-tabular" viewBox="0 0 24 24">
    <line x1="2" y1="13" x2="22" y2="13" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1 1" opacity="0.6"/>
    <polygon points="4,13 6,21 18,21 20,13" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="3,13 5,7 19,7 21,13" fill="currentColor" fill-opacity="0.35" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <line x1="9" y1="7" x2="8" y2="13" stroke="currentColor" stroke-width="1.2"/>
    <line x1="14" y1="7" x2="15" y2="13" stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <!-- 2. Pinnacle Iceberg / Bergy Bit -->
  <symbol id="amoh-icon-iceberg-pinnacle" viewBox="0 0 24 24">
    <line x1="2" y1="14" x2="22" y2="14" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1 1" opacity="0.6"/>
    <polygon points="5,14 8,22 16,22 19,14" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="4,14 11,4 14,8 17,5 20,14" fill="currentColor" fill-opacity="0.35" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <!-- 3. Polynya (Open Water Zone in Sea Ice) -->
  <symbol id="amoh-icon-polynya" viewBox="0 0 24 24">
    <path d="M2 6h6l2 3h10l2-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2 18h5l3-3h8l4 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="12" cy="12" rx="6.5" ry="3.5" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
    <path d="M9 12c1.5-1 4.5-1 6 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 4. Antarctic Circumpolar Current (ACC) Streamline -->
  <symbol id="amoh-icon-acc-streamline" viewBox="0 0 24 24">
    <path d="M2 6c4-2 8-2 12 1s6 2 8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <polyline points="19 4 22 7 19 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2 13c5-2 9-1 13 2s5 1 7-1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2 20c4-1 8 0 12 2s6 1 8-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 5. Polar Front Convergence (PF) -->
  <symbol id="amoh-icon-polar-front" viewBox="0 0 24 24">
    <path d="M3 11c3-4 6-4 9 0s6 4 9 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="7.5" y1="11" x2="7.5" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <polyline points="5.5 16 7.5 18 9.5 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="16.5" y1="11" x2="16.5" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <polyline points="14.5 16 16.5 18 18.5 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 6. Blue Whale (Balaenoptera musculus) -->
  <symbol id="amoh-icon-fauna-whale-blue" viewBox="0 0 24 24">
    <path d="M2 13c1-4 6-7 13-6 4 .5 6 3 7 4-2 .5-4 1-5 1-2 3-6 4-11 3-2-.5-3.5-1.5-4-2z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M2 13c-1-1.5-1.5-3.5-1-4 .5.5 1 2 2 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2 13c-1 1.5-1.5 3.5-1 4 .5-.5 1-2 2-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M14 6c0-2-1-3-2-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 1.5"/>
  </symbol>

  <!-- 7. Killer Whale / Orca (Orcinus orca) -->
  <symbol id="amoh-icon-fauna-orca" viewBox="0 0 24 24">
    <path d="M3 14c2-3 7-5 13-3 3 1 5 3 6 4-2 1-4 1-6 1-3 1-8 0-11-1-1-.3-1.7-.7-2-1z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M11 11L12 3c.5 2 1.5 5 2.5 7" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="18" cy="13.5" rx="1.5" ry="0.8" fill="#ffffff" stroke="none"/>
  </symbol>

  <!-- 8. Antarctic Krill (Euphausia superba) -->
  <symbol id="amoh-icon-fauna-krill" viewBox="0 0 24 24">
    <path d="M20 7c-2-2-6-3-9-1-3 2-5 6-7 8-1 1-2 3-2 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M19 10c-3-1-6 0-8 2-2 2-3 5-4 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M20 7l3-3M21 8l2-1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="13" x2="8" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="11" x2="11" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="9" x2="14" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="16" cy="11" r="1.2" fill="#00FF9D" stroke="none"/>
  </symbol>

  <!-- 9. Emperor Penguin (Aptenodytes forsteri) -->
  <symbol id="amoh-icon-fauna-penguin" viewBox="0 0 24 24">
    <!-- Body Profile -->
    <path d="M12 2c-3 0-5 2.5-5 6 0 4 1 8 1 12 0 1 1 2 4 2s4-1 4-2c0-4 1-8 1-12 0-3.5-2-6-5-6z" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <!-- Eye & Beak -->
    <path d="M15 5l4 1-4 1" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="13" cy="5.5" r="0.8" fill="currentColor"/>
    <!-- Flipper Wing -->
    <path d="M9 10c-2 2-3 5-2 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- Chest Patch -->
    <path d="M11 9c1 1 2 1 3 0" fill="none" stroke="#FCC30B" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <!-- 10. CTD Rosette Sensor Carousel -->
  <symbol id="amoh-icon-sensor-ctd" viewBox="0 0 24 24">
    <line x1="12" y1="1" x2="12" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="5" r="1.5" fill="currentColor"/>
    <rect x="5" y="7" width="14" height="13" rx="2" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2"/>
    <line x1="8" y1="7" x2="8" y2="20" stroke="currentColor" stroke-width="1.5"/>
    <line x1="12" y1="7" x2="12" y2="20" stroke="currentColor" stroke-width="1.5"/>
    <line x1="16" y1="7" x2="16" y2="20" stroke="currentColor" stroke-width="1.5"/>
    <rect x="7" y="20" width="10" height="3" rx="1" fill="currentColor"/>
  </symbol>

  <!-- 11. Autonomous Underwater Glider (AUV) -->
  <symbol id="amoh-icon-sensor-glider" viewBox="0 0 24 24">
    <path d="M3 12c0-2 4-3 12-3s7 2 7 3-4 3-7 3-12-1-12-3z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="11,9 6,2 9,2 14,9" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="11,15 6,22 9,22 14,15" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="22" y1="12" x2="24" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 12. Marine Protected Area (MPA) Boundary Badge -->
  <symbol id="amoh-icon-nav-mpa" viewBox="0 0 24 24">
    <polygon points="12,2 21,6 21,12 12,22 3,12 3,6" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 13. Polar Research Vessel (R/V) -->
  <symbol id="amoh-icon-nav-vessel" viewBox="0 0 24 24">
    <path d="M2 17l2-5h16l2 5c-4 2-18 2-20 0z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <rect x="6" y="7" width="8" height="5" rx="1" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/>
    <line x1="10" y1="3" x2="10" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="2" y1="20" x2="22" y2="20" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/>
  </symbol>
</svg>
