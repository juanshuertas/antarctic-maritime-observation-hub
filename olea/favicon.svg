<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- AMOH Antarctic Maritime Observation Hub — Official Vector Favicon -->
  <defs>
    <radialGradient id="amoh-abyss" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142138"/>
      <stop offset="85%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="amoh-ice-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#caf9f7"/>
      <stop offset="100%" stop-color="#35c3c8"/>
    </linearGradient>
    <linearGradient id="amoh-needle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5100"/>
      <stop offset="100%" stop-color="#ff7b39"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Abyssal Base -->
  <circle cx="32" cy="32" r="30" fill="url(#amoh-abyss)" stroke="#1f344d" stroke-width="1.5"/>

  <!-- Polar Stereographic Rings & Crosshairs -->
  <circle cx="32" cy="32" r="23" stroke="#00799b" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.65"/>
  <circle cx="32" cy="32" r="16" stroke="#35c3c8" stroke-width="0.75" opacity="0.45"/>
  <line x1="32" y1="4" x2="32" y2="60" stroke="#00799b" stroke-width="0.6" stroke-dasharray="1 3" opacity="0.4"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#00799b" stroke-width="0.6" stroke-dasharray="1 3" opacity="0.4"/>

  <!-- Satellite Orbit Ellipse (WOD Purple) -->
  <ellipse cx="32" cy="32" rx="27" ry="9" transform="rotate(-28 32 32)" stroke="#7646ff" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.85"/>
  <circle cx="48" cy="23.5" r="1.8" fill="#caf9f7" filter="url(#glow)"/>

  <!-- Stylized Antarctic Landmass & Ice Core -->
  <path d="M29 20 C34 19, 39 22, 41 26 C43 30, 42 34, 39 37 C36 40, 31 43, 26 42 C22 41, 20 37, 21 33 C22 29, 25 21, 29 20 Z" 
        fill="url(#amoh-ice-glow)" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Antarctic Peninsula Vector Projection -->
  <path d="M26 23 L22 15 L24 14 L28 20 Z" fill="#caf9f7"/>

  <!-- Maritime Astrolabe / Beacon Needle (South Pole Focus) -->
  <polygon points="32,8 34.5,29 32,32 29.5,29" fill="url(#amoh-needle)"/>
  <polygon points="32,56 34,35 32,32 30,35" fill="#35c3c8" opacity="0.85"/>

  <!-- Central Pivot Point -->
  <circle cx="32" cy="32" r="2.8" fill="#101626" stroke="#caf9f7" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="1.2" fill="#ff5100"/>
</svg>