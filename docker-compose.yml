services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amoh-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-edge}
      - DATA_DIR=/app/data
      - EXPEDITION_ID=${EXPEDITION_ID:-NGRS-ANTA-2027}
      - JWT_SECRET=${JWT_SECRET:-}
      - ANON_SALT=${ANON_SALT:-}
    restart: unless-stopped