name: PB124 Public Field App

on:
  push:
    branches: ['pb124-meri-deploy-20261001-181027']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pb124-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${ steps.deployment.outputs.page_url }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment artifact
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload PB124 static artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pb124-pages-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5