name: PB124 Pages

on:
  workflow_dispatch:
  push:
    branches:
      - pb124-meri-live-v6
    paths:
      - "pb124-pages-site/**"
      - ".github/workflows/pb124-pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pb124-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout PB124 deployment branch
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PB124 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pb124-pages-site
          include-hidden-files: true

      - name: Deploy PB124 Pages
        id: deployment
        uses: actions/deploy-pages@v4
