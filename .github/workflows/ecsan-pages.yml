name: ECSAN static microclass

on:
  push:
    branches: [main]
    paths:
      - 'ecsan-ddhh-dih-toolkit/**'
      - '.github/workflows/ecsan-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ecsan-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ecsan-ddhh-dih-toolkit/package-lock.json
      - name: Install dependencies
        working-directory: ecsan-ddhh-dih-toolkit
        run: npm ci
      - name: Build static site
        working-directory: ecsan-ddhh-dih-toolkit
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ecsan-ddhh-dih-toolkit/dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4