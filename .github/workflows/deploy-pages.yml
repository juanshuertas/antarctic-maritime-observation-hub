name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'services/backend/app/**'
      - 'services/backend/scripts/export_api_static.py'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pb124-pages static assets branch
        run: git fetch origin pb124-pages
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/backend/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Import static public assets
        run: pnpm assets:web
      - name: Export static API snapshots from backend
        run: |
          pip install -r services/backend/requirements.txt
          pnpm snapshot:api
      - name: Build GitHub Pages bundle
        run: pnpm build:pages
        env:
          VITE_PUBLIC_BASE: /antarctic-maritime-observation-hub/
      - name: Verify Pages bundle and MapLibre workers
        run: |
          test -s apps/web/dist-pages-olea/index.html
          test -s apps/web/dist-pages-olea/assets/maplibre-gl-worker.mjs
          test -f apps/web/dist-pages-olea/assets/maplibre-gl-shared.mjs
          grep -Fq '/antarctic-maritime-observation-hub/assets/' apps/web/dist-pages-olea/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-pages-olea

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
