name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'services/backend/app/**'
      - 'services/backend/scripts/export_api_static.py'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pb124-pages static assets branch
        run: git fetch origin pb124-pages
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/backend/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Import static public assets
        run: pnpm assets:web
      - name: Export static API snapshots from backend
        run: |
          pip install -r services/backend/requirements.txt
          pnpm snapshot:api
      - name: Build GitHub Pages bundle
        run: pnpm build:pages
        env:
          VITE_PUBLIC_BASE: /antarctic-maritime-observation-hub/olea/
      - name: Verify Pages bundle and MapLibre workers
        run: |
          test -s apps/web/dist-pages-olea/index.html
          test -s apps/web/dist-pages-olea/assets/maplibre-gl-worker.mjs
          test -f apps/web/dist-pages-olea/assets/maplibre-gl-shared.mjs
          test -s apps/web/dist-pages-olea/fonts/Poppins-Regular.woff2
          test -s apps/web/dist-pages-olea/olea-symbol.svg
          grep -Fq '/antarctic-maritime-observation-hub/olea/assets/' apps/web/dist-pages-olea/index.html
      - name: Upload OLEA bundle
        uses: actions/upload-artifact@v4
        with:
          name: olea-pages
          path: apps/web/dist-pages-olea
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout GitHub Pages source branch
        uses: actions/checkout@v4
        with:
          ref: pb124-pages
          path: pages
          fetch-depth: 0
      - name: Download OLEA bundle
        uses: actions/download-artifact@v4
        with:
          name: olea-pages
          path: dist-pages-olea
      - name: Replace only the OLEA site directory
        run: |
          find pages/olea -type f -name index.html -printf '%P\n' \
            | grep -v '^index\.html$' > "$RUNNER_TEMP/olea-routes.txt"
          mkdir -p pages/olea
          rsync -a --delete dist-pages-olea/ pages/olea/
          while IFS= read -r route; do
            [ -n "$route" ] || continue
            mkdir -p "pages/olea/$(dirname "$route")"
            cp dist-pages-olea/index.html "pages/olea/$route"
          done < "$RUNNER_TEMP/olea-routes.txt"
          cp dist-pages-olea/index.html pages/olea/404.html
          test -s pages/olea/index.html
          test -s pages/olea/observatory/index.html
          test -s pages/olea/404.html
          test "$(find pages/olea -type f -name index.html | wc -l)" -gt 1
      - name: Commit and publish OLEA to pb124-pages
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add olea
          if git diff --cached --quiet; then
            echo "OLEA output is already current."
            exit 0
          fi
          git commit -m "deploy: publish OLEA under /olea/"
          git push origin HEAD:pb124-pages
